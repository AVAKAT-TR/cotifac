services:
  - type: web
    name: cotifac
    env: python
    plan: free

    buildCommand: >
      pip install -r requirements.txt &&
      python manage.py makemigrations &&
      python manage.py migrate

    startCommand: "gunicorn COTIFAC.wsgi:application"

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: COTIFAC.settings
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: DATABASE_URL
        fromDatabase:
          name: cotifac-db      # 👈 mismo nombre que tu base en Render
          property: connectionString
